<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning HTML & CSS</title>
</head>
<!-- this is a body tag -->
<body>


    <h1>Hello World</h1>
    <h2>Learning HTML & CSS</h2>
    <h3>Subheading</h3>
    <h4>Another Subheading</h4>
    <h5>Subheading</h5>
    <h6>Subheading</h6>


    <p>This is a paragraph.</p>


    <!-- anchor tag [<a></a>] is used to create a link to another page or website. The href attribute specifies the URL of the page the link goes to. The text between the opening and closing anchor tags is what will be displayed as the clickable link on the webpage. -->

    <a href="https://gamerzoneofficial.vercel.app/">GAMER ZONE WEBSITE</a>

    <br>


    <!-- br tag is used to create a line break in the text. It is an empty tag, meaning it does not have a closing tag. When the browser encounters a br tag, it will move the text that follows it to a new line. -->

    <br>

    <a href="hello.html">Go To Hello Page</a>

    <br>


    <!-- img tag is used to display an image on a webpage. The src attribute specifies the URL of the image file, and the alt attribute provides alternative text that will be displayed if the image cannot be loaded. The width and height attributes can be used to specify the size of the image. -->

    <img src="https://i.pinimg.com/736x/be/45/07/be45074861235fd52eae16b7e7f7c5a6.jpg" alt="A beautiful landscape" height="200">

    <br>

    <b>Bold Text</b>
    <i>Italic Text</i>
    <u>Underlined Text</u>

    <big>Big Text</big>
    <small>Small Text</small>
















</body>
</html>
